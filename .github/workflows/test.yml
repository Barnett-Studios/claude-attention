name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Toolchain
        run: |
          rustup show active-toolchain
          rustup component add clippy rustfmt
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Test
        run: cargo test

  test:
    # pinned image: swiftc, sips and codesign behaviour moves with Xcode
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Toolchain
        run: |
          xcode-select -p
          swiftc --version
          jq --version
          /bin/bash --version | head -1
      # stock macOS bash (3.2) is what `#!/usr/bin/env bash` finds on a Mac without Homebrew bash,
      # so both the scripts and the harness run on it deliberately
      - name: Hook behaviour
        run: TEST_BASH=/bin/bash /bin/bash tests/run.sh
      - name: Notifier build
        run: PATH="/usr/bin:/bin:/usr/sbin:/sbin" /bin/bash tests/notifier.sh
      - name: Plugin manifests
        run: |
          jq empty plugin/hooks/hooks.json
          src="$(jq -er '.plugins[] | select(.name == "claude-attention") | .source' .claude-plugin/marketplace.json)"
          test -f "$src/.claude-plugin/plugin.json"
          test "$(jq -r .name "$src/.claude-plugin/plugin.json")" = claude-attention
          test "$(jq -r '.plugins[0].version' .claude-plugin/marketplace.json)" = "$(jq -r .version "$src/.claude-plugin/plugin.json")"
