name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'        # release: full pipeline (binaries + crates.io + brew)
      - 'v[0-9]+.[0-9]+.[0-9]+-*'      # prerelease (e.g. -rc.1): binaries only

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      fail-fast: false   # one target failing shouldn't cancel/mask the others
      matrix:
        include:
          # .github#20: a *-unknown-linux-gnu binary links whatever newer glibc symbols
          # std/its deps reference IF the build host's glibc has them — e.g.
          # pidfd_spawnp/pidfd_getpid (GLIBC_2.39), which std::process::Command links
          # when present, silently raising the shipped binary's floor past Debian 12
          # (2.36), Ubuntu 22.04 LTS (2.35), RHEL 9, and Amazon Linux 2023 (2.34 each)
          # every time `os: ubuntu-latest` promotes to a newer glibc. `cargo-zigbuild`
          # (zig as the C compiler/linker, bundling its own libc headers per glibc
          # version) decouples the floor from the build host entirely: `--target
          # <triple>.2.28` always produces a binary needing at most GLIBC_2.28,
          # regardless of what `ubuntu-latest` resolves to this month — verified
          # locally via objdump before this PR, max required symbol GLIBC_2.28 on
          # both linux targets, zero GLIBC_2.39 references. 2.28 is chosen, not
          # forced by a dependency: it is the floor that still covers all four named
          # distros with room (RHEL 9/AL2023 are the tightest at 2.34).
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            archive: tar.gz
            glibc: "2.28"
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            archive: tar.gz
            glibc: "2.28"
          - target: x86_64-apple-darwin
            os: macos-latest
            archive: tar.gz
          - target: aarch64-apple-darwin
            os: macos-latest
            archive: tar.gz
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      # stable, with the cross target added to that same toolchain (there is no rust-toolchain.toml;
      # the floor is `rust-version` in Cargo.toml)
      - uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88 # master @ 2026-06-30
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      # zig provides its own cross-linker + per-glibc-version libc headers, so
      # neither linux-gnu row needs a system cross-compiler (gcc-aarch64-linux-gnu)
      # any more — zigbuild replaces that step for both rows, not just aarch64.
      - name: Install zig
        if: matrix.glibc != ''
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: "0.16.0"
      - name: Install cargo-zigbuild
        if: matrix.glibc != ''
        run: |
          cargo install cargo-zigbuild --locked --version 0.23.4
          zig version
          cargo-zigbuild --version
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Build
        shell: bash
        run: |
          if [ -n "${{ matrix.glibc }}" ]; then
            cargo zigbuild --release --locked --target "${{ matrix.target }}.${{ matrix.glibc }}"
          else
            cargo build --release --locked --target "${{ matrix.target }}"
          fi
      # The regression test for the floor declared above: a future std/dependency
      # bump that starts referencing a newer symbol (or a zig/libc-headers bump)
      # fails HERE instead of shipping unnoticed — the same way this whole class of
      # bug reached GA the first time (.github#20). ci/glibc-floor.sh (self-tested
      # in ci.yml against a fixture, so this gate has actually been shown to fail)
      # uses `readelf`, not `objdump`: the release runner's native objdump cannot
      # read the aarch64 row's binary at all ("file format not recognized" —
      # objdump dispatches to a per-architecture BFD backend; readelf parses the
      # ELF structures directly and has no such restriction) and that row would
      # fail every release without ever reaching this check.
      - name: GLIBC floor gate
        if: matrix.glibc != ''
        shell: bash
        run: ci/glibc-floor.sh "target/${{ matrix.target }}/release/ntfyer" "${{ matrix.glibc }}"
      - name: Package (tar.gz)
        if: matrix.archive == 'tar.gz'
        run: |
          cd target/${{ matrix.target }}/release
          tar czf ../../../ntfyer-${{ matrix.target }}.tar.gz ntfyer
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ntfyer-${{ matrix.target }}
          path: ntfyer-${{ matrix.target }}.*

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write   # create the GitHub Release
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: artifacts/*

  publish:
    needs: build
    if: ${{ !contains(github.ref_name, '-') }}   # skip crates.io on prerelease tags
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88 # master @ 2026-06-30
        with:
          toolchain: stable
      - name: Publish to crates.io
        # Idempotent: a re-run or re-tag of an already-published version is a
        # no-op success, not a hard failure — so brew/artifact fixes can re-release.
        run: |
          # Capture stderr OUTSIDE the crate dir — a log file inside it makes the tree
          # dirty and `cargo publish`'s cleanliness check refuses before uploading.
          log="${RUNNER_TEMP:-/tmp}/ntfyer-publish.log"
          if cargo publish --locked 2>"$log"; then
            echo "published"
          elif grep -qiE "already (exists|uploaded)|is already uploaded" "$log"; then
            echo "already on crates.io — skipping"; cat "$log"
          else
            cat "$log"; exit 1
          fi
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  update-homebrew:
    needs: release
    if: ${{ !contains(github.ref_name, '-') }}   # skip Homebrew tap on prerelease tags
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Update Homebrew formula
        env:
          TAP_TOKEN: ${{ secrets.TAP_TOKEN }}
        run: |
          # Optional: the Homebrew tap needs a push-scoped TAP_TOKEN secret. Skip (green) when it
          # is absent so the crate release is never blocked on the tap.
          if [ -z "$TAP_TOKEN" ]; then
            echo "::notice::TAP_TOKEN unset — skipping Homebrew formula update"
            exit 0
          fi
          VERSION="${GITHUB_REF_NAME#v}"
          SHA_LINUX_X86=$(sha256sum artifacts/ntfyer-x86_64-unknown-linux-gnu.tar.gz | cut -d' ' -f1)
          SHA_LINUX_ARM=$(sha256sum artifacts/ntfyer-aarch64-unknown-linux-gnu.tar.gz | cut -d' ' -f1)
          SHA_MAC_X86=$(sha256sum artifacts/ntfyer-x86_64-apple-darwin.tar.gz | cut -d' ' -f1)
          SHA_MAC_ARM=$(sha256sum artifacts/ntfyer-aarch64-apple-darwin.tar.gz | cut -d' ' -f1)

          git clone "https://x-access-token:${TAP_TOKEN}@github.com/Barnett-Studios/homebrew-tap.git" tap
          cd tap
          mkdir -p Formula
          cat > Formula/ntfyer.rb << 'RUBY'
          class Ntfyer < Formula
            desc "Fail-open attention signal (popup, chime, bell) for agent harnesses and scripts"
            homepage "https://github.com/Barnett-Studios/ntfyer"
          RUBY
          cat >> Formula/ntfyer.rb << EOF
            version "${VERSION}"

            on_macos do
              if Hardware::CPU.arm?
                url "https://github.com/Barnett-Studios/ntfyer/releases/download/v${VERSION}/ntfyer-aarch64-apple-darwin.tar.gz"
                sha256 "${SHA_MAC_ARM}"
              else
                url "https://github.com/Barnett-Studios/ntfyer/releases/download/v${VERSION}/ntfyer-x86_64-apple-darwin.tar.gz"
                sha256 "${SHA_MAC_X86}"
              end
            end

            on_linux do
              if Hardware::CPU.arm?
                url "https://github.com/Barnett-Studios/ntfyer/releases/download/v${VERSION}/ntfyer-aarch64-unknown-linux-gnu.tar.gz"
                sha256 "${SHA_LINUX_ARM}"
              else
                url "https://github.com/Barnett-Studios/ntfyer/releases/download/v${VERSION}/ntfyer-x86_64-unknown-linux-gnu.tar.gz"
                sha256 "${SHA_LINUX_X86}"
              end
            end

            def install
              bin.install "ntfyer"
            end

            test do
              system "#{bin}/ntfyer", "--help"
            end
          end
          EOF

          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add Formula/ntfyer.rb
          git diff --cached --quiet || git commit -m "Update ntfyer to ${VERSION}"
          git push
