name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Toolchain
        run: |
          rustup show active-toolchain
          rustup component add clippy rustfmt
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Test
        run: cargo test --locked
      # the release workflow's GLIBC-floor gate, shown to fail on a dump that needs GLIBC_2.39
      - name: Self-test the GLIBC floor gate
        if: runner.os == 'Linux'
        run: |
          ci/glibc-floor.sh ci/fixtures/readelf-2.28.txt 2.28
          if ci/glibc-floor.sh ci/fixtures/readelf-2.39-pidfd.txt 2.28; then
            echo "::error::glibc-floor.sh should have failed on the 2.39 fixture but exited 0"
            exit 1
          fi

  adapter:
    # the Claude Code adapter, against the built binary, under stock bash (3.2 on macOS)
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Build
        run: cargo build --locked
      - name: Adapter
        run: /bin/bash tests/adapter.sh
      - name: Plugin manifests
        run: |
          jq empty plugin/hooks/hooks.json
          src="$(jq -er '.plugins[] | select(.name == "ntfyer") | .source' .claude-plugin/marketplace.json)"
          test -f "$src/.claude-plugin/plugin.json"
          test "$(jq -r .name "$src/.claude-plugin/plugin.json")" = ntfyer
          test "$(jq -r '.plugins[0].version' .claude-plugin/marketplace.json)" = "$(jq -r .version "$src/.claude-plugin/plugin.json")"
