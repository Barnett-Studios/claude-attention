[package]
name = "ntfyer"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
description = "Get a human's attention when an agent (or any script) needs them: popup, chime and terminal bell on macOS and Linux."
license = "MIT OR Apache-2.0"
repository = "https://github.com/Barnett-Studios/ntfyer"
readme = "README.md"
keywords = ["notification", "agents", "hooks", "cli", "attention"]
categories = ["command-line-utilities"]
include = ["src/**", "notifier/**", "Cargo.toml", "README.md", "CONTRACT.md", "LICENSE-*"]

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[dev-dependencies]
tempfile = "3"
